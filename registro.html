<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>GymManager</h1>

        <nav>

            <a href="index.php">Inicio</a>

            <a href="clases.php">Clases</a>

            <a href="contacto.php">Contacto</a>

            <a href="login.html">Iniciar sesión</a>

            <a href="registro.html">Crear cuenta</a>

        </nav>

    </header>


    <main class="reserva">

        <h2>Crear cuenta</h2>

        <p>Regístrate para gestionar tus reservas.</p>


        <form action="registrar_usuario.php" method="post">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >


            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="password">
                Contraseña (mínimo 8 caracteres)
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >


            <button type="submit" class="boton">
                Crear cuenta
            </button>

        </form>


        <p>
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>

    </main>


    <footer>

        <p>© 2026 GymManager</p>

    </footer>

</body>

</html>
