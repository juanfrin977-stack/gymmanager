    <main class="reserva">

        <h2>Iniciar sesión</h2>

        <p>
            Accede a tu cuenta para gestionar tus reservas.
        </p>


        <form action="iniciar_sesion.php" method="post">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <button type="submit" class="boton">
                Iniciar sesión
            </button>

        </form>


        <p>

            ¿No tienes una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>
